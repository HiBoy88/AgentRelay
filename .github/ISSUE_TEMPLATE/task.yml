name: Agent task
description: A task generated from an approved implementation plan
title: "[Task] "
labels: ["task:planned"]
body:
  - type: markdown
    attributes: { value: "由主控 Agent 从已批准计划生成。" }
  - type: textarea
    id: task_id
    attributes: { label: task_id }
    validations: { required: true }
  - type: textarea
    id: parent_plan
    attributes: { label: parent_plan }
    validations: { required: true }
  - type: textarea
    id: depends_on
    attributes: { label: depends_on }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: 目标 }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 范围 }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: 验收标准 }
    validations: { required: true }
  - type: textarea
    id: tests
    attributes: { label: 测试要求 }
    validations: { required: true }
  - type: input
    id: agent
    attributes: { label: 建议执行 Agent }
  - type: textarea
    id: artifacts
    attributes: { label: 完成后产物 }
    validations: { required: true }
